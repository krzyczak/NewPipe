name: Rebase feat/nostr-sync on TeamNewPipe refactor

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rebase-feat-nostr-sync
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/nostr-sync
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch TeamNewPipe refactor branch
        run: |
          if git remote get-url teamnewpipe >/dev/null 2>&1; then
            git remote set-url teamnewpipe https://github.com/TeamNewPipe/NewPipe.git
          else
            git remote add teamnewpipe https://github.com/TeamNewPipe/NewPipe.git
          fi
          git fetch --no-tags teamnewpipe refactor

      - name: Sync fork refactor branch with TeamNewPipe/refactor
        run: |
          set -euo pipefail
          git push --force origin teamnewpipe/refactor:refs/heads/refactor
          echo "Synced origin/refactor to TeamNewPipe/refactor." >> "$GITHUB_STEP_SUMMARY"

      - name: Rebase when TeamNewPipe/refactor is ahead
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          NEW_COMMITS="$(git rev-list --count HEAD..teamnewpipe/refactor)"

          if [ "$NEW_COMMITS" -eq 0 ]; then
            echo "There is nothing to do."
            echo "There is nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Found $NEW_COMMITS new commit(s) on TeamNewPipe/refactor."

          if git rebase teamnewpipe/refactor; then
            git push --force-with-lease origin HEAD:feat/nostr-sync
            {
              echo "Rebased \`feat/nostr-sync\` onto \`TeamNewPipe/refactor\`."
              echo "New commits detected: $NEW_COMMITS"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git rebase --abort || true
          echo "Rebase conflict detected. Opening or updating PR for conflict resolution."

          PR_NUMBER="$(gh pr list \
            --base refactor \
            --head feat/nostr-sync \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base refactor \
              --head feat/nostr-sync \
              --title "Rebase conflict: feat/nostr-sync onto refactor" \
              --body $'Automated nightly rebase detected conflicts while rebasing `feat/nostr-sync` onto `TeamNewPipe/refactor`.\n\n`refactor` in this fork is kept synced to `TeamNewPipe/refactor` by workflow automation.'
            PR_NUMBER="$(gh pr list \
              --base refactor \
              --head feat/nostr-sync \
              --state open \
              --json number \
              --jq '.[0].number // empty')"
          fi

          HAS_MARKER_COMMENT="$(gh pr view "$PR_NUMBER" --json comments --jq '[.comments[] | select(.body | contains("<!-- rebase-conflict-bot -->"))] | length')"

          if [ "$HAS_MARKER_COMMENT" -eq 0 ]; then
            gh pr comment "$PR_NUMBER" --body $'<!-- rebase-conflict-bot -->\n@copilot Please resolve the current merge conflicts so `feat/nostr-sync` can be rebased cleanly onto `refactor` (which mirrors `TeamNewPipe/refactor`).\nPreserve existing `feat/nostr-sync` functionality and keep the project buildable.'
          fi

          {
            echo "Rebase conflict detected while rebasing \`feat/nostr-sync\` onto \`TeamNewPipe/refactor\`."
            echo "New commits detected: $NEW_COMMITS"
            echo "Opened or updated PR #$PR_NUMBER (\`feat/nostr-sync\` -> \`refactor\`)."
            if [ "$HAS_MARKER_COMMENT" -eq 0 ]; then
              echo "Posted an \`@copilot\` request on the PR."
            else
              echo "An \`@copilot\` request comment already exists on the PR."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
